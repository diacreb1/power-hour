<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Sun rays (representing morning/power hour) -->
  <g transform="translate(256, 256)">
    <!-- Center circle -->
    <circle r="60" fill="url(#gold)" opacity="0.9"/>
    
    <!-- Rays -->
    <g stroke="url(#gold)" stroke-width="12" stroke-linecap="round" opacity="0.8">
      <line y1="-140" y2="-100"/>
      <line y1="-140" y2="-100" transform="rotate(45)"/>
      <line y1="-140" y2="-100" transform="rotate(90)"/>
      <line y1="-140" y2="-100" transform="rotate(135)"/>
      <line y1="-140" y2="-100" transform="rotate(180)"/>
      <line y1="-140" y2="-100" transform="rotate(225)"/>
      <line y1="-140" y2="-100" transform="rotate(270)"/>
      <line y1="-140" y2="-100" transform="rotate(315)"/>
    </g>
    
    <!-- Cross overlay -->
    <g stroke="white" stroke-width="8" stroke-linecap="round">
      <line y1="-30" y2="30"/>
      <line x1="-25" x2="25" y1="-10"/>
    </g>
  </g>
</svg>
